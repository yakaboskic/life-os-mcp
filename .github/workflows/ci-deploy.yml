name: Verify and deploy LifeOS
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.release.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: deploy/node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test deploy/web-gateway/server.test.mjs
      - run: npm run build
      - name: Validate operational scripts
        run: |
          bash -n scripts/release-build.sh scripts/deploy-github.sh scripts/gcp-provision.sh scripts/gcp-web-gateway.sh scripts/mcp-remote.sh deploy/bootstrap-vm.sh deploy/lifeos-deploy deploy/backup-upload.sh
          python3 -m py_compile scripts/gcp-iap-policy.py scripts/gcp-monitoring.py scripts/release-upload.py deploy/monitor.py deploy/upload-backup.py
          python3 -m unittest scripts/test_release_upload.py deploy/test_monitor.py deploy/test_upload_backup.py
          scripts/release-check-units.sh
      - name: Package and smoke-test production release
        env:
          LIFE_OS_RELEASE_SHA: ${{ github.sha }}
        run: scripts/release-build.sh release
      - id: release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: life-os-${{ github.sha }}
          path: release/life-os.tar.gz*
          if-no-files-found: error
          retention-days: 14
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.LIFE_OS_DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    environment: production
    concurrency:
      group: life-os-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: release
          merge-multiple: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Authenticate for deployment
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Upload exact verified artifact and supervise VM rollout
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          GCP_INSTANCE: ${{ secrets.GCP_INSTANCE }}
          GCP_RELEASE_BUCKET: ${{ secrets.GCP_RELEASE_BUCKET }}
        run: scripts/deploy-github.sh
